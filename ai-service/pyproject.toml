[project]
name = "turniting-ai-service"
version = "0.1.0"
description = "Lightweight FastAPI service for Turniting text analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "pymupdf>=1.24",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# F005 analyzer: long provenance docstrings/warnings and Spanish synthetic fixtures
"app/services/analyzer/*.py" = ["E501"]
"tests/test_analyzer.py" = ["E501"]
"scripts/f005_*.py" = ["E501", "E402"]
