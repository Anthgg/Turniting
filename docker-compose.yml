services:
  db:
    image: postgres:16-alpine
    container_name: turniting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turniting}
      POSTGRES_USER: ${POSTGRES_USER:-turniting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - turniting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ai-service:
    build:
      context: ./ai-service
    container_name: turniting-ai
    restart: unless-stopped
    environment:
      PORT: 8000
      PYTHON_ENV: ${PYTHON_ENV:-development}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_TURNITIN_REPORT_MB: ${MAX_TURNITIN_REPORT_MB:-30}
      OCR_MIN_CHARS_PER_PAGE: ${OCR_MIN_CHARS_PER_PAGE:-20}
      OCR_MIN_LOW_TEXT_PAGE_RATIO: ${OCR_MIN_LOW_TEXT_PAGE_RATIO:-0.5}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      OCR_ENGINE_VERSION: ${OCR_ENGINE_VERSION:-3.7.0}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-es}
      OCR_MODEL: ${OCR_MODEL:-PP-OCRv5_mobile_det+latin_PP-OCRv5_mobile_rec}
      OCR_MODEL_DIR: /data/models/paddleocr
      OCR_PIPELINE_VERSION: ${OCR_PIPELINE_VERSION:-f003-v1}
      OCR_DPI: ${OCR_DPI:-220}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-120000}
      OCR_MAX_PAGES_PER_RUN: ${OCR_MAX_PAGES_PER_RUN:-150}
      OCR_MAX_RENDER_PIXELS: ${OCR_MAX_RENDER_PIXELS:-20000000}
      OCR_LOW_CONFIDENCE_THRESHOLD: ${OCR_LOW_CONFIDENCE_THRESHOLD:-0.60}
      OCR_MAX_CONCURRENT_JOBS: ${OCR_MAX_CONCURRENT_JOBS:-1}
      OCR_MIN_DIGITAL_CHARS: ${OCR_MIN_DIGITAL_CHARS:-20}
      OCR_MIN_DIGITAL_WORDS: ${OCR_MIN_DIGITAL_WORDS:-4}
      OCR_IMAGE_AREA_RATIO: ${OCR_IMAGE_AREA_RATIO:-0.15}
      OCR_BLANK_PAGE_THRESHOLD: ${OCR_BLANK_PAGE_THRESHOLD:-0.004}
      OCR_DESKEW_MIN_ANGLE: ${OCR_DESKEW_MIN_ANGLE:-1.0}
      OCR_CONTRAST_RANGE: ${OCR_CONTRAST_RANGE:-70}
      PADDLE_PDX_CACHE_HOME: /data/models/paddleocr
      # F005 local AI analyzer: weights are imported with scripts/import_model_artifact.py into
      # ./data/models (Git-ignored) and mounted read-only; missing weights only make a model UNAVAILABLE.
      AI_MODEL_V2_PATH: /data/models/local/candidate-v2
      AI_MODEL_V3_PATH: /data/models/local/candidate-v3
      AI_MODEL_F006_PATH: /data/models/local/experimental-f006
      AI_MODEL_F006_1_PATH: /data/models/local/f006_1/experimental_f006_1
      AI_MODEL_F006_1_1_PATH: /data/models/local/f006_1_1/experimental_f006_1_1
      LOCAL_PREFERRED_ANALYZER: ${LOCAL_PREFERRED_ANALYZER:-EXPERIMENTAL_F006_1_MODEL}
      LOCAL_PREFERRED_ANALYZER_FALLBACK: ${LOCAL_PREFERRED_ANALYZER_FALLBACK:-CANDIDATE_MODEL_V3}
      AI_BASELINE_MODEL_PATH: /data/models/local/baseline
      AI_MODEL_DEVICE: ${AI_MODEL_DEVICE:-auto}
      MODEL_MAX_RESIDENT: ${MODEL_MAX_RESIDENT:-1}
      MODEL_MAX_JOBS: ${MODEL_MAX_JOBS:-1}
      AI_MODEL_CPU_THREADS: ${AI_MODEL_CPU_THREADS:-4}
      MIN_PARAGRAPH_CHARS: ${MIN_PARAGRAPH_CHARS:-120}
      MIN_PARAGRAPH_WORDS: ${MIN_PARAGRAPH_WORDS:-20}
      MIN_PARAGRAPH_TOKENS: ${MIN_PARAGRAPH_TOKENS:-32}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - turniting_ai_models:/data/models/paddleocr
      - ./data/models:/data/models/local:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: turniting-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-turniting}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/${POSTGRES_DB:-turniting}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-turniting}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/${POSTGRES_DB:-turniting}?schema=public
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-30000}
      AI_OCR_TIMEOUT_MS: ${AI_OCR_TIMEOUT_MS:-180000}
      AI_ANALYSIS_TIMEOUT_MS: ${AI_ANALYSIS_TIMEOUT_MS:-600000}
      AI_SERVICE_AUTH_MODE: none
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_TURNITIN_REPORT_MB: ${MAX_TURNITIN_REPORT_MB:-30}
      UPLOAD_DIR: /data/uploads
      REPORT_STORAGE_ROOT: /data/reports
      REPORT_RETENTION_HOURS: ${REPORT_RETENTION_HOURS:-24}
      TRAINING_DIR: /app/training
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    command: ["npm", "run", "start:with-migrations"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - turniting_uploads:/data/uploads
      - turniting_reports:/data/reports
      # F004: versioned training manifests/reports, read-only (no datasets or weights are baked into the image)
      - ./training:/app/training:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
        VITE_MAX_TURNITIN_REPORT_MB: ${MAX_TURNITIN_REPORT_MB:-30}
    container_name: turniting-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  turniting_pgdata:
  turniting_uploads:
  turniting_reports:
  turniting_ai_models:
