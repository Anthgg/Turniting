# Training configuration (baselines + transformer). Values tuned on VALIDATION only.
seed: 42

sampling:
  # Mass per dataset (normalised by its row count) -> no dataset dominates by size.
  dataset_weights:
    iberautextification: 2.0
    autextification2023: 1.5
    semeval2024_task8: 1.0
    m4: 1.0
    mage: 1.0
    hc3: 0.6
    hc3_chinese: 0.3
    raid: 1.2
    turingbench: 0.4
    ghostbuster_essay: 0.8
    default: 1.0
  label_balance: 0.5          # share of MACHINE inside each dataset
  language_weights:
    default: 1.0
    es: 2.0                   # SPANISH_TRAIN_WEIGHT; chosen from candidates below on VALIDATION
  spanish_weight_candidates: [1.0, 1.5, 2.0, 3.0]
  academic_weight: 1.5        # essays / scientific / abstracts / peer reviews
  adversarial_train_fraction_cap: 0.15   # adversarial rows are allowed but never dominate

baseline:
  train_rows: 100000          # weighted sample of TRAIN (RAM budget: 11 GB, hashed TF-IDF ~3.5k nnz/doc)
  tune_rows: 40000            # for SPANISH_TRAIN_WEIGHT selection
  max_chars: 2000
  max_iter: 30
  word_ngrams: [1, 2]
  char_ngrams: [3, 5]
  lr_C: 4.0
  svm_C: 0.5
  stack_rows: 20000           # disjoint TRAIN sample for the stacked ensemble
  lodo_train_rows: 40000      # leave-one-dataset-out baselines
  eval_cap_per_split: 40000

transformer:
  cpu_profile: true           # configs/training_gpu.yaml sets false
  model: microsoft/mdeberta-v3-base
  revision: a0484667b22365f84929a935b5e50a51f71f159d
  fallback_model: xlm-roberta-base
  # CPU-only host (no CUDA/MPS): see README "Hardware constraints".
  max_length: 256             # 512 on GPU hosts
  stride: 64                  # 128 on GPU hosts (window overlap)
  max_windows_per_doc: 4
  freeze_embeddings: true
  trainable_top_layers: 4     # all 12 on GPU hosts
  train_windows: 9000
  epochs: 2
  learning_rate: 5.0e-5       # raised from 3e-5 after the smoke run (only top layers + head train)
  weight_decay: 0.01
  warmup_ratio: 0.06
  batch_size: 16
  gradient_accumulation: 2
  eval_every_steps: 150
  early_stopping_patience: 2
  metric_for_best_model: macro_f1
  val_docs: 900
  aggregation_candidates: [mean, trimmed_mean, topk_mean, max]
  num_threads: 8

refinement:
  train_windows: 3000
  target_fraction: 0.7        # Spanish + academic target; 0.3 global replay
  learning_rate: 1.0e-5
  epochs: 1

calibration:
  methods: [temperature, platt, isotonic]
  select_by: [ece, brier]
  low_fpr_max: 0.01
  high_precision_target: 0.95

evaluation:
  test_docs: 4000
  ood_docs: 1500
  adversarial_docs: 2400
  unseen_generator_docs: 1200
  unseen_domain_docs: 1200
  spanish_extra_docs: 1200
  academic_extra_docs: 1000
